# Test-time grub.cfg used by run.sh --multi. Hand-tuned menuentries that
# bake in console=ttyS0 so we can observe kernel boot over QEMU's serial
# console and assert the chosen distro actually booted.
#
# This is NOT the production isoboot grub.cfg — it's only used during the
# multi-distro E2E test. The production cfg uses dynamic ISO enumeration.

set timeout=3
set default=alpine

serial --unit=0 --speed=115200
terminal_input --append serial
terminal_output --append serial

insmod part_gpt
insmod fat
insmod ext2
insmod exfat
insmod iso9660
insmod loopback
insmod search
insmod search_fs_file
insmod search_fs_uuid
insmod regexp
insmod probe
insmod linux
insmod normal
insmod test
insmod echo

search --no-floppy --set=DATA --file /isos/.isoboot
if [ -n "$DATA" ]; then
    probe -u ($DATA) --set=DATA_UUID
fi

menuentry "Alpine virt" --id=alpine {
    set iso_path=/isos/alpine.iso
    echo ">>> isoboot: booting alpine"
    loopback loop ($DATA)$iso_path
    linux  (loop)/boot/vmlinuz-virt initrd=/boot/initramfs-virt modules=loop,squashfs,sd-mod,usb-storage,virtio_pci,virtio_blk modloop=($DATA)$iso_path alpine_dev=loop console=ttyS0,115200 console=tty0
    initrd (loop)/boot/initramfs-virt
}

menuentry "Ubuntu 26.04 server" --id=ubuntu {
    set iso_path=/isos/ubuntu.iso
    echo ">>> isoboot: booting ubuntu"
    loopback loop ($DATA)$iso_path
    linux  (loop)/casper/vmlinuz iso-scan/filename=$iso_path boot=casper nosplash --- console=ttyS0,115200 console=tty0
    initrd (loop)/casper/initrd
}

menuentry "Fedora 43 server" --id=fedora {
    set iso_path=/isos/fedora.iso
    echo ">>> isoboot: booting fedora"
    loopback loop ($DATA)$iso_path
    linux  (loop)/images/pxeboot/vmlinuz inst.stage2=hd:UUID=$DATA_UUID:$iso_path console=ttyS0,115200 console=tty0
    initrd (loop)/images/pxeboot/initrd.img
}
