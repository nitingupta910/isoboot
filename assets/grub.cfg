# isoboot — GRUB menu for booting Linux distro ISOs from a USB drive.
#
# This config is intentionally readable and auditable. It uses only
# upstream-supported mechanisms:
#   * loopback.cfg (shipped by Debian, Ubuntu, Mint, Manjaro, Kali, MX, ...)
#   * documented kernel boot parameters (findiso, iso-scan/filename,
#     img_dev/img_loop, isofrom_device/isofrom_system)
#
# No custom kernel modules, no device-mapper hacks, no opaque blobs.

set timeout=15
set default=0

# Serial console — harmless on real hardware, essential for QEMU `-serial stdio`
# end-to-end tests. `--append` keeps the VGA console working too.
serial --unit=0 --speed=115200
terminal_input --append serial
terminal_output --append serial

insmod part_gpt
insmod part_msdos
insmod fat
insmod ext2
insmod exfat
insmod iso9660
insmod loopback
insmod search
insmod search_fs_file
insmod search_fs_uuid
insmod search_label
insmod regexp
insmod probe
insmod normal
insmod linux
insmod all_video
insmod gfxterm
insmod png
insmod test
insmod echo

# Locate the data partition by its marker file (written at install time).
search --no-floppy --set=DATA --file /isos/.isoboot
if [ -n "$DATA" ]; then
    probe -u ($DATA) --set=DATA_UUID
fi

if [ -z "$DATA" ]; then
    menuentry "ERROR: isoboot data partition not found" {
        echo "Could not locate /isos/.isoboot on any partition."
        echo "Reformat with `isoboot install` or restore the marker file."
        echo "Press any key to reboot."
        read
        reboot
    }
else
    # Build the menu by iterating /isos/*.iso. For each ISO we probe whether
    # the distro ships an upstream loopback.cfg; if so, that's the only entry
    # we need. Otherwise we emit a set of per-family fallback recipes.
    for iso_file in (${DATA})/isos/*.iso; do
        if [ -e "${iso_file}" ]; then
            regexp --set=1:iso_base '/([^/]+)\.iso$' "${iso_file}"

            # Probe-mount to see if the distro ships its own loopback.cfg.
            # Use a probe-only loop name so we don't conflict with anything
            # established later by user-picked menuentries.
            loopback probe "${iso_file}"

            if [ -e (probe)/boot/grub/loopback.cfg ]; then
                menuentry "${iso_base}" "${iso_file}" --class iso --id "iso-${iso_base}" {
                    set iso_path="$2"
                    export iso_path
                    loopback loop "$iso_path"
                    set root=(loop)
                    configfile /boot/grub/loopback.cfg
                }
            else
                # No upstream loopback.cfg — emit per-family fallback recipes.
                menuentry "${iso_base}  [Debian-live: findiso]" "${iso_file}" --class iso --id "iso-${iso_base}" {
                    set iso_path="$2"
                    loopback loop "$iso_path"
                    linux  (loop)/live/vmlinuz boot=live components findiso="$iso_path"
                    initrd (loop)/live/initrd.img
                }
                menuentry "${iso_base}  [Ubuntu/casper: iso-scan]" "${iso_file}" --class iso --id "iso-${iso_base}" {
                    set iso_path="$2"
                    loopback loop "$iso_path"
                    linux  (loop)/casper/vmlinuz iso-scan/filename="$iso_path" boot=casper quiet splash ---
                    initrd (loop)/casper/initrd
                }
                menuentry "${iso_base}  [Fedora/dracut: iso-scan]" "${iso_file}" --class iso --id "iso-${iso_base}" {
                    set iso_path="$2"
                    loopback loop "$iso_path"
                    linux  (loop)/isolinux/vmlinuz iso-scan/filename="$iso_path" rd.live.image quiet
                    initrd (loop)/isolinux/initrd.img
                }
                menuentry "${iso_base}  [openSUSE: isofrom_device]" "${iso_file}" --class iso --id "iso-${iso_base}" {
                    set iso_path="$2"
                    loopback loop "$iso_path"
                    linux  (loop)/boot/x86_64/loader/linux isofrom_device=/dev/disk/by-uuid/${DATA_UUID} isofrom_system="$iso_path" splash=silent
                    initrd (loop)/boot/x86_64/loader/initrd
                }
                menuentry "${iso_base}  [Arch: img_dev/img_loop]" "${iso_file}" --class iso --id "iso-${iso_base}" {
                    set iso_path="$2"
                    loopback loop "$iso_path"
                    linux  (loop)/arch/boot/x86_64/vmlinuz-linux img_dev=UUID=${DATA_UUID} img_loop="$iso_path" archisobasedir=arch
                    initrd (loop)/arch/boot/x86_64/initramfs-linux.img
                }
                menuentry "${iso_base}  [Alpine virt: modloop]" "${iso_file}" --class iso --id "iso-${iso_base}" {
                    set iso_path="$2"
                    loopback loop "$iso_path"
                    linux  (loop)/boot/vmlinuz-virt initrd=/boot/initramfs-virt modules=loop,squashfs,sd-mod,usb-storage,virtio_pci,virtio_blk modloop="$iso_path" alpine_dev=loop
                    initrd (loop)/boot/initramfs-virt
                }
            fi

            loopback -d probe
        fi
    done
fi

menuentry "" { true }
menuentry "Reboot" { reboot }
menuentry "Power off" { halt }
