[package]
name = "isoboot"
version = "0.1.1"
edition = "2021"
description = "Multi-boot USB for Linux ISOs — no bundled binaries, no custom kernel modules."
license = "MIT"
rust-version = "1.74"
readme = "README.md"
repository = "https://github.com/nitingupta910/isoboot"
homepage = "https://github.com/nitingupta910/isoboot"
keywords = ["usb", "iso", "boot", "grub", "ventoy"]
categories = ["command-line-utilities", "filesystem"]
include = [
    "src/**/*",
    "assets/**/*",
    "Cargo.toml",
    "README.md",
    "LICENSE",
]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
