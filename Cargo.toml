[package]
name = "isoboot"
version = "0.1.0"
edition = "2021"
description = "Multi-boot USB for Linux ISOs — no bundled binaries, no custom kernel modules."
license = "MIT"
rust-version = "1.74"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
